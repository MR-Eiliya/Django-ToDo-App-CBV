version: "3.12"

services:
  backend:
    build: .
    container_name: backend2
    command: python manage.py runserver 0.0.0.0:8080
    volumes:
      - ./core:/app
    ports:
      - "8080:8080"
    environment:
      - SECRET_KEY=test
      - DEBUG=True
      - EMAIL_HOST=smtp
      - EMAIL_PORT=25
      - EMAIL_USE_TLS=False
    depends_on:
      - smtp

  smtp:
    image: rnwood/smtp4dev
    container_name: smtp4dev2
    ports:
      - "6025:25"   # SMTP
      - "5001:80"   # Web UI
    restart: unless-stopped
