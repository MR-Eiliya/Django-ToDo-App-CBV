{% extends 'base.html' %}

{% block title %}Update Task{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-4 col-md-offset-4 col-xs-6 col-xs-offset-3">
            <div class="logo">
                
            </div>

            <form method="post" action="{% url 'todo:task-update' task.id %}" class="add-control">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.title }}
                </div>
                <button type="submit" class="update-btn">Update</button>
            </form>

            <p class="err text-danger text-center hidden"><i class="fa fa-warning"></i> Please enter a task</p>
        </div>
    </div>
</div>
{% endblock %}
