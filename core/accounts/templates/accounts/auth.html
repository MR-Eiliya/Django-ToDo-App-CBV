{% load static %}
<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Sign up / Login Form</title>
    <link rel="stylesheet" href="{% static 'css/auth_style.css' %}">

  </head>
    
  <body>
  <!DOCTYPE html>
<html>
<head>
	<title>Slide Navbar</title>
	<link rel="stylesheet" type="text/css" href="slide navbar style.css">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
</head>
<body>
	<div class="main">  	
		<input type="checkbox" id="chk" aria-hidden="true">

			<div class="signup">
				<form method="post">
					{% csrf_token %}
					<label for="chk" aria-hidden="true">Sign up</label>
					<input type="text" name="username" placeholder="User name" required="">
					<input type="email" name="email" placeholder="Email" required="">
					<input type="password" name="password1" placeholder="Password" required="">
					<input type="password" name="password2" placeholder="Confirm Password" required="">
					<button type="submit" name="register_submit">Sign up</button>
				</form>
			</div>

			<div class="login">
				<form method="post">
					{% csrf_token %}
				
					<label for="chk" aria-hidden="true">Login</label>
					<input type="text" name="identifier" placeholder="Email or Username" required="">
					<input type="password" name="password" placeholder="Password" required="">
					<button type="submit" name="login_submit">Login</button>
				</form>
			</div>
	</div>

</body>
</html>
  </body>
  
</html>


{% if login_form.errors %}
<script>
Swal.fire({
	toast: true,
	position: 'top-end',
	icon: 'error',
	title: 'Invalid email-username or password',
	showConfirmButton: false,
	timer: 3000,
	timerProgressBar: true,
	background: '#1e1e1e',
	color: '#fff'
})
</script>
{% endif %}



{% if register_form.errors %}
<script>
Swal.fire({
  toast: true,
  position: 'top-end',
  icon: 'error',
  title: 'Sign Up failed — please enter your data correctly!',
  showConfirmButton: false,
  timer: 3000,
  timerProgressBar: true,
  background: '#1e1e1e',
  color: '#fff'
})
</script>
{% endif %}
